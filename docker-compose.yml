services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equiphub-backend
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: equiphub-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
